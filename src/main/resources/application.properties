spring.application.name=spring-boot3-migration-demo
server.port=8080

# In-memory H2. The password matches the one hardcoded in LegacyExportService.
spring.datasource.url=jdbc:h2:mem:inventory;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=Inv3ntory!2024
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.defer-datasource-initialization=true
spring.jpa.open-in-view=false
spring.sql.init.mode=always

# VULNERABLE: H2 web console exposed with no auth beyond the DB password.
spring.h2.console.enabled=true
spring.h2.console.settings.web-allow-others=true

# Deprecated in Spring Boot 3.4 and removed in Spring Boot 4
# (replaced by management.endpoints.access.default / management.endpoint.<id>.access).
management.endpoints.enabled-by-default=true
management.endpoint.shutdown.enabled=true
# VULNERABLE: every actuator endpoint, including env, heapdump and shutdown, is public.
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

inventory.upload-dir=${java.io.tmpdir}/inventory-uploads
